<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="IPMI Tasks">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f3f5f9">
  <title>IPMI Tasks</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=4">
  <script src="theme.js?v=3"></script>
</head>
<body>
  <!-- Sign-in screen -->
  <div id="authView" class="auth" hidden>
    <button type="button" class="theme-btn auth-theme" aria-label="Change day/night mode"><span class="theme-icon"></span><span class="theme-label"></span></button>
    <div class="auth-card">
      <img class="auth-logo" src="logo-mark.png" alt="" width="120" height="80">
      <p class="brand-kicker">Integrity Property Management</p>
      <h1>IPMI Tasks</h1>
      <p class="auth-sub">Sign in to see your tasks on any device.</p>
      <form id="authForm" autocomplete="on">
        <label>Email
          <input id="authEmail" type="email" autocomplete="email" required>
        </label>
        <label>Password
          <input id="authPassword" type="password" autocomplete="current-password" minlength="6" required>
        </label>
        <button type="submit" class="btn-primary" id="signInBtn">Sign in</button>
        <button type="button" class="btn-link" id="signUpBtn">First time? Create your account</button>
      </form>
      <p id="authMsg" class="auth-msg" hidden></p>
    </div>
  </div>

  <!-- Loading -->
  <div id="loadingView" class="loading">
    <img src="logo-mark.png" alt="" width="84" height="56">
  </div>

  <!-- Main app -->
  <div class="app" id="appView" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="brand-badge"><img src="logo-mark.png" alt="" width="40" height="27"></span>
        <div>
          <strong>IPMI Tasks</strong>
          <span>Integrity Property Management</span>
        </div>
      </div>
      <div class="topbar-right">
        <button type="button" class="theme-btn" aria-label="Change day/night mode"><span class="theme-icon"></span><span class="theme-label"></span></button>
        <button id="avatarBtn" class="avatar" title="Account" aria-label="Account"></button>
      </div>
    </header>

    <section class="hero">
      <p class="today" id="todayLabel"></p>
      <h1 id="greeting">Hello</h1>
    </section>

    <div id="banner" class="banner" hidden>
      <span class="banner-icon" aria-hidden="true">&#128276;</span>
      <span id="bannerText"></span>
      <button id="bannerClose" class="banner-close" aria-label="Dismiss">&#10005;</button>
    </div>

    <section class="summary card">
      <div class="stats">
        <div><strong id="countOpen">0</strong><span>Open</span></div>
        <div class="overdue"><strong id="countOverdue">0</strong><span>Overdue</span></div>
        <div><strong id="countDone">0</strong><span>Done</span></div>
      </div>
      <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>
      <p class="progress-label">Progress <strong id="progressPct">0%</strong> completed</p>
    </section>

    <form id="addForm" class="add-form card" autocomplete="off">
      <input id="titleInput" type="text" placeholder="What needs to be done?" maxlength="200" required>
      <div class="add-options">
        <label class="field">
          <span>Due</span>
          <input id="dueInput" type="date">
        </label>
        <label class="field">
          <span>Priority</span>
          <select id="priorityInput">
            <option value="normal">Normal</option>
            <option value="high">High</option>
            <option value="low">Low</option>
          </select>
        </label>
        <label class="field">
          <span>List</span>
          <select id="listInput"></select>
        </label>
      </div>
      <button type="submit" class="btn-primary add-btn"><span aria-hidden="true">+</span> Add task</button>
    </form>

    <nav class="filters" aria-label="Filter tasks">
      <button class="filter active" data-filter="all">All <span class="count" data-count="all">0</span></button>
      <button class="filter" data-filter="today">Today <span class="count" data-count="today">0</span></button>
      <button class="filter" data-filter="upcoming">Upcoming <span class="count" data-count="upcoming">0</span></button>
      <button class="filter" data-filter="done">Done <span class="count" data-count="done">0</span></button>
    </nav>

    <div class="tools">
      <select id="listFilter" aria-label="Filter by list"></select>
      <input id="searchInput" type="search" placeholder="Search tasks" aria-label="Search tasks">
    </div>

    <main id="taskList"></main>

    <footer class="footer">
      <button id="clearDone" class="btn-link">Clear completed</button>
      <div class="footer-right">
        <span id="syncStatus" class="sync-status"></span>
        <button id="exportBtn" class="btn-link">Export</button>
        <label class="btn-link">Import<input id="importInput" type="file" accept="application/json" hidden></label>
        <button id="signOutBtn" class="btn-link">Sign out</button>
      </div>
    </footer>
    <p class="account" id="accountLabel"></p>
  </div>

  <div id="toast" class="toast" hidden>
    <span id="toastMsg"></span>
    <button id="toastUndo">Undo</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=2"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
